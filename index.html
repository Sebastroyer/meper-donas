<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perdóname 🥺</title>
<style>
:root{--sky:#87ceeb;--navy:#1b3a6b;--pink:#ff9ec7;--mid:#191970;--soft:#eaf6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Segoe UI",Trebuchet MS,Arial,sans-serif;color:var(--mid);background:linear-gradient(180deg,var(--mid) 0%,var(--navy) 35%,var(--sky) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden}
.card{background:rgba(234,246,255,.95);border:3px solid var(--pink);border-radius:28px;padding:22px 24px 26px;width:min(92vw,440px);text-align:center;box-shadow:0 12px 40px rgba(25,25,112,.5);margin:16px 0 90px}
h1{margin:6px 0 4px;font-size:1.7rem;color:var(--navy)}
p{margin:6px 0 16px;font-size:1.1rem;line-height:1.4}
svg.mouse{width:200px;height:200px}
.tear{fill:#6ec3f5;animation:fall 1.6s infinite}
.tear.b{animation-delay:.8s}
@keyframes fall{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(42px);opacity:0}}
.mouse{animation:sob 1.2s ease-in-out infinite}
@keyframes sob{50%{transform:translateY(3px)}}
.happy .tear,.happy .sad{display:none}
.mouse .smile{display:none}
.happy .smile{display:block}
.happy.mouse{animation:none}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;min-height:56px}
.btn{font:inherit;font-size:1.1rem;font-weight:700;border:0;border-radius:999px;padding:13px 30px;cursor:pointer;color:#fff;transition:left .35s ease,top .35s ease,transform .15s;z-index:10}
.btn:active{transform:scale(.95)}
.yes{background:var(--pink);color:var(--mid);box-shadow:0 4px 0 #d6709c}
#no{background:var(--navy);box-shadow:0 4px 0 var(--mid)}
#no.final{background:var(--pink);color:var(--mid);box-shadow:0 4px 0 #d6709c}
.garden{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;pointer-events:none;padding:0 4px;bottom:env(safe-area-inset-bottom,0px)}
.garden svg{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.garden svg:nth-child(even){animation-delay:-1.5s}
@keyframes sway{50%{transform:rotate(5deg)}}
.heart{position:fixed;top:-30px;font-size:24px;animation:drop linear forwards;pointer-events:none}
@keyframes drop{to{transform:translateY(110vh) rotate(40deg)}}
#thanks{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<symbol id="fl" viewBox="0 0 60 110">
<path d="M30 40V110" stroke="#1b4f9c" stroke-width="4" fill="none"/>
<path d="M30 85Q10 78 8 62Q26 64 30 85Z" fill="#2f6fb3"/>
<g fill="#ff9ec7"><ellipse cx="30" cy="14" rx="9" ry="14"/><ellipse cx="30" cy="14" rx="9" ry="14" transform="rotate(72 30 30)"/><ellipse cx="30" cy="14" rx="9" ry="14" transform="rotate(144 30 30)"/><ellipse cx="30" cy="14" rx="9" ry="14" transform="rotate(216 30 30)"/><ellipse cx="30" cy="14" rx="9" ry="14" transform="rotate(288 30 30)"/></g>
<circle cx="30" cy="30" r="8" fill="#fff3b8"/>
</symbol>
</svg>

<div class="card">
<svg class="mouse" id="mouse" viewBox="0 0 200 200" aria-label="Ratita llorando">
<circle cx="50" cy="55" r="28" fill="#cfdcf0"/><circle cx="50" cy="55" r="17" fill="#ffb3d1"/>
<circle cx="150" cy="55" r="28" fill="#cfdcf0"/><circle cx="150" cy="55" r="17" fill="#ffb3d1"/>
<ellipse cx="100" cy="110" rx="62" ry="55" fill="#dfe9f7"/>
<circle cx="50" cy="130" r="10" fill="#ff9ec7" opacity=".55"/><circle cx="150" cy="130" r="10" fill="#ff9ec7" opacity=".55"/>
<g class="sad" stroke="#191970" stroke-width="4" stroke-linecap="round"><path d="M52 80L88 68"/><path d="M148 80L112 68"/></g>
<ellipse cx="72" cy="102" rx="20" ry="24" fill="#fff" stroke="#191970" stroke-width="3"/>
<ellipse cx="128" cy="102" rx="20" ry="24" fill="#fff" stroke="#191970" stroke-width="3"/>
<circle cx="72" cy="108" r="14" fill="#191970"/><circle cx="128" cy="108" r="14" fill="#191970"/>
<circle cx="66" cy="100" r="5.5" fill="#fff"/><circle cx="122" cy="100" r="5.5" fill="#fff"/>
<circle cx="78" cy="113" r="2.5" fill="#fff"/><circle cx="134" cy="113" r="2.5" fill="#fff"/>
<ellipse cx="72" cy="122" rx="15" ry="4" fill="#6ec3f5" opacity=".7" class="sad"/><ellipse cx="128" cy="122" rx="15" ry="4" fill="#6ec3f5" opacity=".7" class="sad"/>
<ellipse class="tear" cx="60" cy="128" rx="4" ry="7"/><ellipse class="tear b" cx="140" cy="128" rx="4" ry="7"/>
<ellipse cx="100" cy="130" rx="7" ry="5" fill="#ff8fb8"/>
<path class="sad" d="M86 152Q100 138 114 152" stroke="#191970" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<path class="smile" d="M84 144Q100 162 116 144" stroke="#191970" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<g stroke="#191970" stroke-width="2" stroke-linecap="round" opacity=".6"><path d="M40 138L10 132"/><path d="M40 146L12 152"/><path d="M160 138L190 132"/><path d="M160 146L188 152"/></g>
</svg>
<h1 id="title">Perdóname 🥺</h1>
<p id="msg">Esto es lo único que se me ocurrió...<br>¿sí me quieres perdonar?</p>
<div class="btns" id="btns">
<button class="btn yes" id="yes">Sí 💙</button>
<button class="btn" id="no">No</button>
</div>
<p id="thanks">¡Gracias! Te quiero mucho 💙🌸</p>
</div>

<div class="garden">
<svg width="46" height="84"><use href="#fl"/></svg>
<svg width="64" height="116"><use href="#fl"/></svg>
<svg width="40" height="74"><use href="#fl"/></svg>
<svg width="56" height="102"><use href="#fl"/></svg>
<svg width="44" height="80"><use href="#fl"/></svg>
<svg width="66" height="120"><use href="#fl"/></svg>
<svg width="42" height="78"><use href="#fl"/></svg>
</div>

<script>
const no=document.getElementById('no'),yes=document.getElementById('yes');
const texts=['¿Seguro?','Piénsalo...','Porfa 🥺','Una oportunidad','Ándale','No me hagas llorar','Mira a la ratita','Ya casi...','Última vez','Mejor di que sí'];
let n=0,ph=null;
function win(){
  document.getElementById('btns').style.display='none';
  document.getElementById('title').textContent='¡Gracias! 💙';
  document.getElementById('msg').style.display='none';
  document.getElementById('thanks').style.display='block';
  document.getElementById('mouse').classList.add('happy');
  for(let i=0;i<30;i++){
    const h=document.createElement('span');
    h.className='heart';h.textContent=['💙','🌸','💗'][i%3];
    h.style.left=Math.random()*100+'vw';
    h.style.animationDuration=(3+Math.random()*3)+'s';
    h.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(h);
  }
}
yes.addEventListener('click',win);
no.addEventListener('click',()=>{
  if(n>=10){win();return}
  n++;
  if(!ph){
    const r=no.getBoundingClientRect();
    ph=document.createElement('span');
    ph.style.cssText='display:inline-block;width:'+r.width+'px;height:'+r.height+'px';
    no.after(ph);
    no.style.position='fixed';
    no.style.left=r.left+'px';no.style.top=r.top+'px';
    void no.offsetWidth;
  }
  no.textContent=texts[n-1];
  const m=12,w=no.offsetWidth,h=no.offsetHeight;
  no.style.left=(m+Math.random()*(innerWidth-w-2*m))+'px';
  no.style.top=(m+Math.random()*(innerHeight-h-2*m))+'px';
  if(n===10){
    setTimeout(()=>{
      no.style.position='';no.style.left='';no.style.top='';
      ph.remove();
      no.textContent='Sí 💙';
      no.classList.add('final');
    },1200);
  }
});
</script>
</body>
</html>
